name: Update Anime Schedule

on:
  schedule:
    # يعمل تلقائياً كل 12 ساعة
    - cron: '0 */12 * * *'
  workflow_dispatch: # يضيف زراً في واجهة GitHub لتشغيل السكربت يدوياً متى شئت

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Schedule Updater
        run: node update-schedule.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add api/schedule.json
          # إذا لم تكن هناك حلقات جديدة لن يقوم بعمل التزام (Commit) فارغ
          git commit -m "تحديث تلقائي لجدول الحلقات 📅" || echo "لا توجد تحديثات جديدة للجدول"
          git push
